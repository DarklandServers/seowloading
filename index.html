<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEOW Roleplay</title>
  <link rel="preload" href="bg-vid.webm?v=1.0.1" as="video" type="video/webm">
  <link rel="preload" href="bg.png?v=1.0.1" as="image" type="image/png">
  <style>
    html, body, .bg { background-color: #05070c; }
  </style>
  <link rel="stylesheet" href="css/loading.css?v=1.0.1">
  <script src="js/bridge.js?v=1.0.1"></script>
</head>
<body>
  <video class="bg" id="bg" autoplay muted loop playsinline preload="auto" poster="bg.png?v=1.0.1" fetchpriority="high">
    <source src="bg-vid.webm?v=1.0.1" type="video/webm">
    <source src="bg-vid.mp4?v=1.0.1" type="video/mp4">
  </video>
  <script>
    var background = document.getElementById("bg");
    if (background && background.play) {
      background.muted = true;
      var attempts = 0;
      var kick = function () {
        if (!background.paused && background.currentTime > 0) return;
        var pending = background.play();
        if (pending && pending.catch) pending.catch(function () {});
      };
      background.addEventListener("loadeddata", kick);
      background.addEventListener("canplay", kick);
      kick();
      var timer = setInterval(function () {
        attempts += 1;
        if ((!background.paused && background.currentTime > 0) || attempts > 24) {
          clearInterval(timer);
          return;
        }
        kick();
      }, 250);
    }
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js?v=1.0.1").catch(function () {});
    }
  </script>
  <div class="shade" aria-hidden="true"></div>

  <main class="panel">
    <h1 class="title" id="title">SEOW</h1>
    <div class="subtitle-row">
      <p class="subtitle" id="subtitle">ROLEPLAY</p>
      <span class="accent" aria-hidden="true"></span>
    </div>
    <p class="status" id="status-line">Connecting to server...</p>
    <div class="bar" aria-hidden="true"><span class="bar-fill" id="bar-fill"></span></div>
    <p class="file" id="file-line" hidden></p>
    <ul class="steps" id="steps"></ul>
  </main>

  <footer class="footer">
    <div class="lockup">
      <span class="tick" aria-hidden="true"></span>
      <div>
        <p class="brand">SEOW Roleplay</p>
        <p class="tagline" id="tagline"></p>
      </div>
    </div>
    <div class="player" id="player" hidden>
      <img class="player-avatar" id="player-avatar" alt="">
      <div>
        <p class="player-name" id="player-name"></p>
        <p class="player-id" id="player-id"></p>
      </div>
    </div>
  </footer>

  <div class="online">
    <span class="live-dot" aria-hidden="true"></span>
    <div>
      <p class="online-label">Server online</p>
      <p class="build" id="build"></p>
    </div>
  </div>

  <script src="js/progress.js?v=1.0.1"></script>
  <script src="js/config.js?v=1.0.1"></script>
  <script src="js/ui.js?v=1.0.1"></script>
  <script src="js/gmod.js?v=1.0.1"></script>
  <script src="js/preview.js?v=1.0.1"></script>
</body>
</html>
